# 步态与几何参数（唯一定义源）
#
# 本文件是固件与仿真、Blender 骨架的唯一数据源。
# 固件编译期由 tools/ 脚本生成为 spider_params.h。
# 任何改动必须同步：tools/gait_sim/ik.py、tools/blender/build_rig.py、components/kinematics
#
# 单位：长度 mm，角度 度（deg），时间 s，时间戳 ms
# 坐标系：X 前、Y 左、Z 上（见 docs/hardware.md §1）

meta:
  version: 1
  description: 机器蜘蛛 2DOF 四足参数
  # sweep_range 为 gait_sim 扫参区间；实机调试前不得使用 sweep 内的候选值
  freeze_status: pending_sweep   # pending_sweep | frozen

# ---------------------------------------------------------------------------
# 机身
# ---------------------------------------------------------------------------
body:
  length_mm: 200.0
  width_mm: 120.0
  layer_gap_mm: 30.0
  total_mass_g: 1100.0        # 重量预算内，扭矩余量约 3 倍
  co_height_mm: 55.0          # 重心高度（电池装于下层板中央低位）

# ---------------------------------------------------------------------------
# 腿几何
# ---------------------------------------------------------------------------
leg:
  L1_mm: 100.0                # 大腿：髋轴心 -> 膝轴心
  L2_mm: 110.0                # 小腿：膝轴心 -> 足端
  alpha_deg: 30.0             # 大腿下倾角（支架打印固定，不可控）
  beta_cruise_deg: 39.5       # 巡航小腿倾角；@L1=100,L2=110,α=30 → H=120mm，耦合 1:1.21
  # 外八中立角（参考值，实际逐腿取自 legs[].psi_deg）
  splay_deg: 40.0
  # 派生量（勿手改，由上面的几何计算得出）
  #   H(β)  = L1·sin(α) + L2·sin(β)          站立高度
  #   R(β)  = L1·cos(α) + L2·cos(β)          足端水平半径（髋轴心 -> 足端）
  #   Δψ(stride) = asin(stride / 2R)          髋半摆角

  # 扫参区间（打印前用 gait_sim 扫过再冻结）
  sweep:
    L1_mm: [90.0, 130.0]
    L2_mm: [90.0, 130.0]
    alpha_deg: [25.0, 35.0]
    beta_cruise_deg: [36.0, 44.0]    # 巡航高度 115~125mm 对应的 β 区间

# ---------------------------------------------------------------------------
# 腿位：方位角（从 +X 逆时针）与足端半径
# ---------------------------------------------------------------------------
# 髋关节点在机身坐标的位置（机身四角），步态引擎据此解算支撑足
# r_mm = R(beta_cruise) = L1·cos(α) + L2·cos(β_cruise) = 171.5mm
#
# psi_deg 必须是"该腿向外指"的方位角（X 轴逆时针）：
#   FL 前左 +40°   FR 前右 320°   RL 后左 140°   RR 后右 220°
# 配错会导致支撑多边形非凸、重心落在多边形外，机器人静态就站不稳。
# 校验器会检查凸性与重心内含。
# 外八角刻意前后不等（前 36° / 后 48°），见下方"三足支撑裕度"说明。
# 完全对称（前后均 40°）会使任意三足支撑的裕度为 0，见该节推导。
legs:
  - { id: FL, index: 0, psi_deg: 36.0,  r_mm: 171.5, hip: [ 100.0,  60.0] }  # 左前
  - { id: FR, index: 1, psi_deg: 324.0, r_mm: 171.5, hip: [ 100.0, -60.0] }  # 右前
  - { id: RL, index: 2, psi_deg: 132.0, r_mm: 171.5, hip: [-100.0,  60.0] }  # 左后
  - { id: RR, index: 3, psi_deg: 228.0, r_mm: 171.5, hip: [-100.0, -60.0] }  # 右后

# ---------------------------------------------------------------------------
# 舵机通道映射：leg_index*2 = 髋，leg_index*2+1 = 膝
# ---------------------------------------------------------------------------
servo_map:
  channels: 8
  mapping:
    - [0, FL, hip]
    - [1, FL, knee]
    - [2, FR, hip]
    - [3, FR, knee]
    - [4, RL, hip]
    - [5, RL, knee]
    - [6, RR, hip]
    - [7, RR, knee]
  reserved_channels: 8        # 8..15 预留

# ---------------------------------------------------------------------------
# 姿态与限位
# ---------------------------------------------------------------------------
posture:
  stand_height_mm: 120.0      # 巡航站立高度（膝控制）→ β=39.5°
  height_range_mm: [90.0, 150.0]   # → β∈[21.3°, 65.4°]，与 limits 一致
  sit_height_mm: 95.0         # → β=24.1°
  rest_height_mm: 92.0        # 休息（腹部近地）→ β=22.4°
  spawn_height_mm: 70.0       # 翻车姿态（仰卧，膝部不承重）

limits:
  hip_deg: 60.0               # 髋软限位 ±
  beta_min_deg: 21.3          # 膝软限位下限（腿最伸直）→ H=90mm
  beta_max_deg: 65.4          # 膝软限位上限（腿最屈）→ H=150mm
  max_rate_deg_s: 180.0       # 全局角速度上限（996R 带载保护）
  servo_rated_deg_s: 428.0    # 996R @6V 空载，仅作参考上限

# ---------------------------------------------------------------------------
# 步态
# ---------------------------------------------------------------------------
gait:
  crawl:
    stride_mm: 60.0           # → 髋半摆 ±10.1°
    period_s: 1.7             # → 巡航速度 35.3mm/s
    lift_mm: 28.0             # 上限受 cruise_height - height_min = 30mm 约束
    duty_swing: 0.25          # 单腿摆动相占空比（4 拍错开）
    swing_phases: [0.0, 0.25, 0.50, 0.75]   # FL FR RL RR
  trot:
    stride_mm: 68.0           # → 髋半摆 ±11.4°
    period_s: 1.8             # → 巡航速度 37.8mm/s
    lift_mm: 29.0             # 上限 30mm，取 29 留 1mm 余量（不顶在限位上）
    duty_swing: 0.5           # 对角腿同步
    swing_phases: [0.0, 0.5]  # 相 0: FL+RR；相 1: FR+RL

  speed:
    max_pct: 100.0
    # Trot 高速禁用（防翻约束，不可解锁）
    trot_max_speed_pct: 70.0

  # 摆动相内的四段细分（周期占比）
  swing_profile:
    lift:   [0.00, 0.15]      # 抬起
    reach:  [0.15, 0.55]      # 前摆
    place:  [0.55, 0.70]      # 落下
    push:   [0.70, 1.00]      # 后蹬（推进）

  sweep:
    stride_mm: [45.0, 70.0]
    period_s: [1.5, 2.5]
    lift_mm: [20.0, 30.0]    # 硬上限 30mm = cruise_height - height_min

# ---------------------------------------------------------------------------
# 转向
# ---------------------------------------------------------------------------
turn:
  in_place_max_deg: 25.0      # <25° 可支撑足钉地拧转（零滑移）
  max_yaw_rate_deg_s: 25.0    # 防翻红线，不可解锁
  foot_placement_budget_deg: 45.0   # 单腿落点方位角预算（受髋限位）

strafe_macro:
  max_mm: 150.0               # 单次侧移上限
  estimated_time_s: 6.0       # 100mm 约 5~7s

# ---------------------------------------------------------------------------
# 滑移辅助原语（受控打滑，零硬件成本）
# ---------------------------------------------------------------------------
slip_primitives:
  nudge_max_mm: 50.0          # 棘轮微调单次上限
  lean_max_deg: 10.0          # 差动膝姿态限幅
  skid_turn_max_deg: 10.0     # 搓动转向单次上限
  # 棘轮：慢相静摩擦（机身移动），快相动摩擦（脚复位）
  ratchet:
    slow_phase_s: 0.6
    fast_phase_s: 0.15
    hip_delta_deg: 18.0

# ---------------------------------------------------------------------------
# 滑移预算红线（gait_sim 验收判据，见 docs/gait_design.md §7）
# ---------------------------------------------------------------------------
slip_budget:
  crawl_max_mm_per_cycle: 3.0
  trot_max_mm_per_cycle: 5.0
  model_layer_target: 0.0     # 模型层理论滑移必须为 0

# ---------------------------------------------------------------------------
# 防翻约束（见 docs/gait_design.md §8）
# ---------------------------------------------------------------------------
anti_tip:
  advanced_default: false     # Web 页默认关闭，仅串口可开
  roll_margin_min_deg: 15.0   # 巡航 Trot 横滚裕度，不可解锁
  locked:
    - roll_margin_min_deg
    - max_yaw_rate_deg_s
    - trot_max_speed_pct
  unlocked_by_advanced:
    - lean_max_deg
    - nudge_max_mm
    - height_range_mm
    - speed_max_pct

# ---------------------------------------------------------------------------
# 安全
# ---------------------------------------------------------------------------
safety:
  heartbeat_timeout_ms: 500    # 超时自动急停
  estop_response_ms: 50       # 急停响应目标
  move_task_tick_ms: 2        # motion 任务周期
  motion_task_priority: 5
  web_task_priority: 4
  estop_command_queue_len: 16

# ---------------------------------------------------------------------------
# 硬件电气
# ---------------------------------------------------------------------------
electrical:
  pca9685:
    i2c_port: 0
    i2c_sda_gpio: 21
    i2c_scl_gpio: 22
    i2c_freq_hz: 400000
    pwm_freq_hz: 50
    pwm_res_bits: 12          # 4096 级
    addr: 0x60
  servo:
    min_pulse_us: 1000
    max_pulse_us: 2000
    neutral_us: 1500
    endpoint_margin_us: 8     # 端点余量，严禁贴死
    calibrated: false         # 首次上电后逐机标定置 true

# ---------------------------------------------------------------------------
# gait_sim 预览器配置
# ---------------------------------------------------------------------------
sim:
  fps: 60
  cycles: 10                  # 预览周期数
  friction_model: none        # none | coulomb（棘轮动作预览时用 coulomb）
  coulomb:
    mu_static: 0.9
    mu_kinetic: 0.6
  check:
    - cruise_height          # 115~125mm
    - height_range          # 覆盖 90~150mm
    - stride                # 爬行 55~60, trot 65~70
    - speed                 # 35~40mm/s
    - knee_range            # 全周期在 [21.3,65.4]
    - hip_range             # 抬脚>=25mm 时不越限
    - slip_budget           # 见 slip_budget
    - ground_clearance       # 摆动相全程 >0
    - leg_interference      # 四腿轨迹无重叠